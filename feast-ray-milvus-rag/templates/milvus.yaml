apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
    spec:
      containers:
        - name: etcd
          image: 'registry.k8s.io/etcd:3.5.16-0'
          command: ['etcd']
          args:
            - '--advertise-client-urls=http://127.0.0.1:2379'
            - '--listen-client-urls=http://0.0.0.0:2379'
            - '--data-dir=/etcd-data'
          ports:
            - containerPort: 2379
          volumeMounts:
            - mountPath: /etcd-data
              name: etcd-data
        - name: minio
          image: 'mirror.gcr.io/minio/minio:RELEASE.2024-09-22T00-33-43Z'
          command: ['minio']
          args: ['server', '/minio-data', '--console-address', ':9001']
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - mountPath: /minio-data
              name: minio-data
        - name: milvus
          image: 'mirror.gcr.io/milvusdb/milvus:v2.5.8'
          command: ['milvus', 'run', 'standalone']
          env:
            - name: ETCD_ENDPOINTS
              value: '127.0.0.1:2379'
            - name: MINIO_ADDRESS
              value: '127.0.0.1:9000'
            - name: MINIO_ACCESS_KEY
              value: minioadmin
            - name: MINIO_SECRET_KEY
              value: minioadmin
          ports:
            - containerPort: 19530
              name: grpc
            - containerPort: 9091
              name: metrics
          volumeMounts:
            - mountPath: /var/lib/milvus
              name: milvus-data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: etcd-data
          emptyDir: {}
        - name: minio-data
          emptyDir: {}
        - name: milvus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: __NAMESPACE__
  labels:
    app: milvus
spec:
  type: ClusterIP
  ports:
    - port: 19530
      targetPort: 19530
      protocol: TCP
      name: grpc
    - port: 9091
      targetPort: 9091
      protocol: TCP
      name: metrics
  selector:
    app: milvus
