project: rag_demo
provider: local

# Ray offline store (handles RaySource natively via ray.data)
offline_store:
  type: ray
  storage_path: /tmp/feast-ray-storage

# Ray compute engine for distributed embedding generation
batch_engine:
  type: ray.engine
  ray_address: "ray://feast-ray-head-svc.feast-rag.svc.cluster.local:10001"
  max_workers: 4
  enable_optimization: true
  broadcast_join_threshold_mb: 100
  target_partition_size_mb: 64

# Milvus online store for vector similarity search
online_store:
  type: milvus
  host: http://milvus.feast-rag.svc.cluster.local
  port: 19530
  vector_enabled: true
  embedding_dim: 384
  index_type: IVF_FLAT
  metric_type: COSINE

# PostgreSQL registry
registry:
  registry_type: sql
  path: postgresql+psycopg://feast:feast@postgres.feast-rag.svc.cluster.local:5432/feast
  cache_ttl_seconds: 10
  sqlalchemy_config_kwargs:
    echo: false
    pool_pre_ping: true

entity_key_serialization_version: 3
