# FeatureStore with SparkApplication compute engine + OpenLineage consumer.
# Images:
#   feature-server: quay.io/nkathole/feature-server:develop-ol-spark-link-v2
#     (feastdev-ci develop + openlineage-python + pyspark)
#   spark driver/executor: quay.io/nkathole/feature-server:spark-application-0.65-ol-listener
#     (Spark 4.0.1 + Feast spark_application main + openlineage-spark listener JAR)
---
apiVersion: v1
kind: Secret
metadata:
  name: openlineage-consumer-secret
  namespace: feast
stringData:
  api_key: "lineage-demo-consumer-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: feast-batch-engine-spark-application
  namespace: feast
data:
  config: |
    type: spark_application
    image: quay.io/nkathole/feature-server:spark-application-0.65-ol-listener
    namespace: feast
    spark_version: "4.0.1"
    driver_cores: 1
    driver_memory: "1g"
    executor_instances: 1
    executor_cores: 1
    executor_memory: "1g"
    job_timeout_seconds: 3600
    poll_interval_seconds: 10
    ttl_seconds_after_finished: 600
    # Spark OpenLineage agent → Feast consumer (same /v1/lineage as Feast producer)
    spark_conf:
      spark.extraListeners: io.openlineage.spark.agent.OpenLineageSparkListener
      spark.openlineage.namespace: customer_churn
      spark.openlineage.transport.type: http
      spark.openlineage.transport.url: http://feast-lineage-demo-registry-rest.feast.svc.cluster.local
      spark.openlineage.transport.endpoint: /v1/lineage
      spark.openlineage.transport.auth.type: api_key
      spark.openlineage.transport.auth.apiKey: lineage-demo-consumer-key
    env:
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: postgres-secret
            key: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-secret
            key: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        valueFrom:
          secretKeyRef:
            name: postgres-secret
            key: POSTGRES_DB
---
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: lineage-demo
  namespace: feast
  labels:
    app.kubernetes.io/part-of: feast-spark-openlineage
spec:
  feastProject: customer_churn
  feastProjectDir:
    git:
      url: https://github.com/ntkathole/feast-automated-setups.git
      ref: main
      featureRepoPath: feast-spark-openlineage/feature_repo
  batchEngine:
    configMapRef:
      name: feast-batch-engine-spark-application
    configMapKey: config
  materialization:
    onlineWriteBatchSize: 10000
  openlineage:
    enabled: true
    transportType: http
    # Feast consumer on the registry REST service (not Marquez)
    transportUrl: "http://feast-lineage-demo-registry-rest.feast.svc.cluster.local"
    transportEndpoint: "v1/lineage"
    apiKeySecretRef:
      name: openlineage-consumer-secret
    extraConfig:
      namespace: "customer_churn"
      producer: "feast-operator"
      emit_on_apply: "true"
      emit_on_materialize: "true"
    consumer:
      enabled: true
      storeType: sql
      apiKeySecretRef:
        name: openlineage-consumer-secret
      namespaceMapping:
        customer_churn: customer_churn
        # Spark OpenLineage jobs use the same logical namespace
        spark_application: customer_churn
  cronJob:
    schedule: "0 */6 * * *"
    suspend: false
    containerConfigs:
      image: quay.io/nkathole/feature-server:develop-ol-spark-link-v2
      commands:
        - feast
        - materialize-incremental
        - "$(date -u +'%Y-%m-%dT%H:%M:%S')"
  services:
    offlineStore:
      persistence:
        store:
          type: postgres
          secretRef:
            name: feast-data-stores
      server:
        image: quay.io/nkathole/feature-server:develop-ol-spark-link-v2
        tls:
          disable: true
        envFrom:
          - secretRef:
              name: postgres-secret
    onlineStore:
      persistence:
        store:
          type: redis
          secretRef:
            name: feast-data-stores
      server:
        image: quay.io/nkathole/feature-server:develop-ol-spark-link-v2
        tls:
          disable: true
        envFrom:
          - secretRef:
              name: postgres-secret
    registry:
      local:
        persistence:
          store:
            type: sql
            secretRef:
              name: feast-data-stores
        server:
          image: quay.io/nkathole/feature-server:develop-ol-spark-link-v2
          restAPI: true
          tls:
            disable: true
          envFrom:
            - secretRef:
                name: postgres-secret
    ui:
      image: quay.io/nkathole/feature-server:develop-ol-spark-link-v2
      envFrom:
        - secretRef:
            name: postgres-secret
